services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-sourcer-local-only}
    ports:
      - "127.0.0.1:${SOURCER_DB_PORT:-55422}:5432"
    volumes:
      - sourcer_database:/var/lib/postgresql/data
      - ./supabase/migrations:/migrations:ro
      - ./deploy/local/init-local-db.sh:/docker-entrypoint-initdb.d/001_init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  postgrest:
    image: hrsourcing-postgrest
    build:
      context: ./deploy/local/postgrest
    environment:
      PGRST_DB_URI: postgres://postgres:${LOCAL_DB_PASSWORD:-sourcer-local-only}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: postgres
      PGRST_SERVER_PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  database-api:
    image: node:20-alpine
    command: node /gateway/gateway.mjs
    volumes:
      - ./deploy/local/gateway.mjs:/gateway/gateway.mjs:ro
    depends_on:
      - postgrest
    restart: unless-stopped

  api:
    environment:
      SUPABASE_URL: http://database-api:8000
      SUPABASE_ANON_KEY: local-internal
      SUPABASE_SERVICE_ROLE_KEY: local-internal
    depends_on:
      db:
        condition: service_healthy
      database-api:
        condition: service_started

  worker:
    environment:
      SUPABASE_URL: http://database-api:8000
      SUPABASE_ANON_KEY: local-internal
      SUPABASE_SERVICE_ROLE_KEY: local-internal
    depends_on:
      db:
        condition: service_healthy
      database-api:
        condition: service_started

  beat:
    environment:
      SUPABASE_URL: http://database-api:8000
      SUPABASE_ANON_KEY: local-internal
      SUPABASE_SERVICE_ROLE_KEY: local-internal
    depends_on:
      db:
        condition: service_healthy
      database-api:
        condition: service_started

  tg-listener:
    environment:
      SUPABASE_URL: http://database-api:8000
      SUPABASE_ANON_KEY: local-internal
      SUPABASE_SERVICE_ROLE_KEY: local-internal

volumes:
  sourcer_database:
