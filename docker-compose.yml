services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      browser-agent:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/data
    restart: unless-stopped

  worker:
    build: ./backend
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: celery -A app.core.celery_app worker -l info
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/data
    restart: unless-stopped

  beat:
    build: ./backend
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: celery -A app.core.celery_app beat -l info
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/data
    restart: unless-stopped

  tg-listener:
    build: ./backend
    env_file: .env
    command: python /app/../scripts/run_telegram_listener.py
    depends_on:
      - api
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./scripts:/scripts
    restart: unless-stopped

  browser-agent:
    build:
      context: .
      dockerfile: browser-agent/Dockerfile
    env_file: .env
    environment:
      DISPLAY: :99
      BROWSER_PROFILE_DIR: /browser-data/profile
      BROWSER_EXECUTABLE_PATH: /usr/bin/chromium
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - browser_profile:/browser-data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  frontend:
    build: ./frontend
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  browser_profile:
